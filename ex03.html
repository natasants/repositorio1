<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disparar eventos com Listener</title>
    <style>
        body{
            background-color: rgba(134, 7, 7, 0.877);
        }
        div#area{
            background: rgb(167, 245, 122);
            color: rgb(113, 146, 21);
            width: 200px;
            height: 200px;
            text-align: center;
            line-height: 200px;
            font-size: 30px;
            font-family: Georgia, 'Times New Roman', Times, serif;
        }
    </style>
</head>
<body>
    <h1>Disparar eventos com Listener</h1>
    <p>Além de disparar eventos dentro do HTML, podemos disparar utilizando listener no JS</p>
    <div id="area">Interaja</div>
    <script>
        var a = document.querySelector('div#area')
        a.addEventListener('click' , clicar)
        a.addEventListener('mouseenter' , entrar)
        a.addEventListener('mouseout' , sair)
        function clicar(){
            a.innerHTML='Clicou'
            a.style.background='pink'
        }
        function entrar(){
         a.innerHTML='Entrou'  
         a.style.background='purple' 
        }
        function sair(){
            a.innerHTML= 'saiu'
            a.style.background='lightblue'
        }
    </script>
</body>
</html>
